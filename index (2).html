<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간편 애착유형 자가진단</title>
<style>
:root { --green:#6aa34b; --pale:#edf6e8; --line:#d8e2d2; --text:#243126; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; background:#f5f7f3; color:var(--text); }
main { max-width:720px; margin:24px auto; padding:0 14px; }
.card { background:white; border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 5px 18px #1d38100d; }
header { background:var(--pale); padding:22px 24px; border-bottom:1px solid var(--line); }
h1 { font-size:clamp(21px,4vw,28px); margin:0 0 8px; color:#315b24; }
header p { margin:0; line-height:1.6; font-size:14px; }
.identity { display:flex; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
.identity label { flex:1; font-size:13px; font-weight:700; }
input[type=text] { width:100%; padding:10px; border:1px solid #cbd6c5; border-radius:8px; margin-top:6px; font-size:16px; }
.content { padding:22px 20px 24px; }
.progress-row { display:flex; justify-content:space-between; align-items:center; font-size:14px; margin-bottom:10px; color:#52614d; }
.track { height:8px; background:#e8eee4; border-radius:20px; overflow:hidden; margin-bottom:25px; }
.bar { height:100%; width:0; background:var(--green); transition:width .2s; }
.question-number { color:#6a9b4c; font-weight:800; font-size:14px; margin-bottom:8px; }
.question { font-size:clamp(20px,4vw,25px); line-height:1.55; font-weight:750; min-height:100px; display:flex; align-items:center; margin:0 0 22px; }
.options { display:grid; gap:10px; }
.option { display:flex; align-items:center; gap:12px; border:1px solid #d8e1d3; border-radius:12px; padding:14px 15px; cursor:pointer; line-height:1.4; transition:.15s; }
.option:has(input:checked) { background:#eff7e9; border-color:var(--green); box-shadow:0 0 0 1px var(--green) inset; }
.option input { width:20px; height:20px; accent-color:var(--green); flex-shrink:0; }
.option strong { font-size:15px; }
.actions { display:flex; gap:10px; margin-top:26px; }
button { border:0; border-radius:10px; padding:13px 18px; font-size:16px; font-weight:750; cursor:pointer; }
button:disabled { opacity:.38; cursor:not-allowed; }
.secondary { background:#edf0eb; color:#34432e; }
.primary { background:var(--green); color:white; flex:1; }
.note { margin-top:18px; color:#687265; font-size:12px; line-height:1.6; }
.result { display:none; }
.result h2 { margin:0 0 8px; color:#315b24; font-size:25px; }
.result-intro { line-height:1.6; margin:0 0 20px; }
.scorebox { border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
.score-head { display:flex; justify-content:space-between; font-weight:750; margin-bottom:9px; }
.meter { height:10px; border-radius:20px; background:#edf0eb; overflow:hidden; }
.meter div { height:100%; background:var(--green); }
.badge { display:inline-block; background:var(--pale); color:#315b24; padding:6px 10px; border-radius:30px; font-weight:750; margin:8px 0 16px; }
.result-text { line-height:1.7; background:#f8faf6; padding:16px; border-radius:12px; }
.result-actions { display:flex; gap:10px; margin-top:18px; }
.result-actions button { flex:1; }
@media (max-width:480px) { main{margin:10px auto;} header{padding:19px;} .identity,.content{padding-left:16px;padding-right:16px;} .question{min-height:125px;} }
</style>
</head>
<body>
<main>
<section class="card">
<header>
<h1>학습 활동지 1 · 간편 애착유형 자가진단</h1>
<p>각 문항을 읽고 자신에게 얼마나 해당하는지 선택해 주세요.<br>정답은 없으며, 평소 자신의 모습을 떠올리며 응답하면 됩니다.</p>
</header>
<div class="identity">
<label>학번(선택)<input type="text" id="studentNo" placeholder="학번 입력"></label>
<label>이름(선택)<input type="text" id="studentName" placeholder="이름 입력"></label>
</div>
<div class="content" id="quiz">
<div class="progress-row"><span id="progressText">1 / 12 문항</span><span id="percent">8% 완료</span></div>
<div class="track"><div class="bar" id="progressBar"></div></div>
<div class="question-number" id="questionNumber">문항 1</div>
<p class="question" id="questionText"></p>
<div class="options" id="options"></div>
<div class="actions">
<button class="secondary" id="prevBtn" disabled>이전</button>
<button class="primary" id="nextBtn" disabled>다음 문항</button>
</div>
<p class="note">응답은 이 기기에서만 계산됩니다. 이름과 학번은 결과 화면에 표시하기 위한 선택 입력이며, 별도로 전송되지 않습니다.</p>
</div>
<div class="content result" id="result">
<h2>진단 결과</h2>
<p class="result-intro" id="resultGreeting"></p>
<div id="scoreDetails"></div>
<div class="badge" id="typeBadge"></div>
<div class="result-text" id="resultDescription"></div>
<p class="note">이 활동은 자기이해를 위한 간편 체크이며, 심리검사나 전문적인 진단을 대신하지 않습니다. 점수가 같거나 비슷하게 나올 수 있고, 관계와 상황에 따라 자신의 모습이 달라질 수 있습니다.</p>
<div class="result-actions">
<button class="secondary" id="reviewBtn">응답 다시 보기</button>
<button class="primary" id="restartBtn">처음부터 다시 하기</button>
</div>
</div>
</section>
</main>
<script>
const questions = [
"나는 가까운 친구나 가족을 믿고 의지할 수 있다.",
"나는 중요한 사람에게 거절당할까 봐 걱정된다.",
"나는 다른 사람과 너무 가까워지는 것이 불편하다.",
"힘든 일이 있을 때 믿을 만한 사람에게 도움을 요청한다.",
"친구가 연락이 늦으면 나를 싫어하게 된 것은 아닐까 걱정한다.",
"나는 혼자 해결하는 것이 편하며 도움받는 것을 좋아하지 않는다.",
"나는 사람들과 친밀한 관계를 맺는 것이 편안하다.",
"나는 친구나 연인이 나를 떠날까 봐 불안할 때가 많다.",
"나는 다른 사람에게 속마음을 잘 털어놓지 않는다.",
"나는 친한 사람과 함께 있을 때 안정감을 느낀다.",
"나는 상대방이 나를 얼마나 좋아하는지 자주 확인하고 싶다.",
"나는 누군가와 지나치게 가까워지는 것을 피하려고 한다."
];
const options = [
["전혀 그렇지 않다",1],
["그렇지 않은 편이다",2],
["보통이다",3],
["그런 편이다",4],
["매우 그렇다",5]
];
const answers = Array(12).fill(null);
let current = 0;
const $ = id => document.getElementById(id);
function render() {
  $("questionNumber").textContent = `문항 ${current+1}`;
  $("questionText").textContent = questions[current];
  $("progressText").textContent = `${current+1} / ${questions.length} 문항`;
  $("percent").textContent = `${Math.round((current+1)/questions.length*100)}% 진행`;
  $("progressBar").style.width = `${(current+1)/questions.length*100}%`;
  $("options").innerHTML = "";
  options.forEach(([label,value]) => {
    const el = document.createElement("label");
    el.className = "option";
    el.innerHTML = `<input type="radio" name="answer" value="${value}" ${answers[current]===value?"checked":""}><strong>${label}</strong>`;
    el.querySelector("input").addEventListener("change", () => {
      answers[current] = value;
      $("nextBtn").disabled = false;
      $("nextBtn").textContent = current === questions.length-1 ? "결과 확인하기" : "다음 문항";
    });
    $("options").appendChild(el);
  });
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = answers[current] === null;
  $("nextBtn").textContent = current === questions.length-1 ? "결과 확인하기" : "다음 문항";
}
$("prevBtn").addEventListener("click", () => { if(current>0){current--;render();} });
$("nextBtn").addEventListener("click", () => {
  if(answers[current]===null) return;
  if(current < questions.length-1){current++;render();}
  else showResult();
});
function showResult() {
  const scores = {
    "안정형": answers[0]+answers[3]+answers[6]+answers[9],
    "불안형": answers[1]+answers[4]+answers[7]+answers[10],
    "회피형": answers[2]+answers[5]+answers[8]+answers[11]
  };
  const max = Math.max(...Object.values(scores));
  const leaders = Object.keys(scores).filter(k=>scores[k]===max);
  const name = $("studentName").value.trim();
  const no = $("studentNo").value.trim();
  $("resultGreeting").textContent = `${no ? no+"번 " : ""}${name ? name+" 학생, " : ""}문항별 응답을 바탕으로 계산한 점수입니다. 각 유형은 4개 문항의 합계이며, 유형별 점수 범위는 4~20점입니다.`;
  $("scoreDetails").innerHTML = Object.entries(scores).map(([type,score]) =>
    `<div class="scorebox"><div class="score-head"><span>${type}</span><span>${score}점 / 20점</span></div><div class="meter"><div style="width:${score/20*100}%"></div></div></div>`
  ).join("");
  $("typeBadge").textContent = leaders.length===1 ? `가장 높은 점수: ${leaders[0]}` : `공동으로 높은 점수: ${leaders.join(" · ")}`;
  const descriptions = {
    "안정형":"관계에서 신뢰와 친밀감을 비교적 편안하게 느끼고, 필요할 때 다른 사람에게 도움을 요청하는 경향과 연결해 생각해 볼 수 있습니다.",
    "불안형":"중요한 사람과의 관계가 멀어지거나 거절당하는 상황을 걱정하고, 상대방의 마음을 확인하고 싶어 하는 경향과 연결해 생각해 볼 수 있습니다.",
    "회피형":"혼자 해결하는 것을 편하게 여기거나, 다른 사람과 지나치게 가까워지는 상황에서 거리를 두려는 경향과 연결해 생각해 볼 수 있습니다."
  };
  $("resultDescription").textContent = leaders.length===1
    ? descriptions[leaders[0]]
    : "두 가지 이상의 유형 점수가 가장 높게 나타났습니다. 한 가지 유형으로 단정하기보다 각 유형의 설명 중 자신에게 해당하는 부분을 함께 살펴보세요.";
  $("quiz").style.display="none";
  $("result").style.display="block";
}
$("reviewBtn").addEventListener("click", () => {
  $("result").style.display="none"; $("quiz").style.display="block"; current=0; render();
});
$("restartBtn").addEventListener("click", () => {
  answers.fill(null); current=0;
  $("studentNo").value=""; $("studentName").value="";
  $("result").style.display="none"; $("quiz").style.display="block"; render();
});
render();
</script>
</body>
</html>
